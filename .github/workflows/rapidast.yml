## This is an example workflow on how to run the rapidast script and upload a parsed results as artifacts ##

name: rapidast-report

on:
  pull_request:
  push:


jobs:
  rapidast:
    runs-on: ubuntu-latest
    container:
      image: quay.io/redhatproductsecurity/rapidast:latest
      options: --user root # default rapidast user not compatible with github runners

    # Target application to scan goes here. This contains a stub example for httpd.
    # A more realistic example would include target a custom container image built
    # pushed to a public container registry in an earlier build step.
    #
    # In the rapidast config file, for this example "http://httpd" would be the target URL.
    #
    services:
      httpd:
        image: docker.io/httpd:latest

    steps:
      - uses: actions/checkout@v4

      - name: run rapidast
        run: |
          pwd
          rapidast.py --config rapidast-config.yaml
          # Display ZAP scan results in GitHub UI
          cat results/*/*/*/zap/zap-report.json >> $GITHUB_OUTPUT

      - name: Upload rapidast parsed results
        uses: actions/upload-artifact@v4
        with:
          path: 'results/*/*/*/*'
        if: ${{ always() }}
